[package]
name = "rmlf"
version = "0.1.0"
edition = "2024"
readme = "README.md"
license = "MIT"
keywords = ["MLF", "multivariate approximation", "multivariate Loewner Framework"]

[dependencies]
faer = "0.24.4"
num-bigint = "0.5.1"
num-integer = "0.1.47"
num-complex = "0.4.6"
num-traits = "0.2.19"
rayon = "1.12.0"
rstsr = "0.10.3"
thiserror = "2.0.21"

[dev-dependencies]
approx = "0.5.1"
serde_json = "1.0.154"

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
lto = true

[profile.profiling]
inherits = "release"
debug = true
